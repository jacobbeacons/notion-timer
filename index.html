<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>60 Second Timer</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #37352f;
    --muted: #9b9a97;
    --track: #ebeae7;
    --accent: #2383e2;
    --done: #e03e3e;
    --btn: #f1f1ef;
    --btn-hover: #e6e5e2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #191919; --fg: #e9e9e7; --muted: #7f7f7f; --track: #2f2f2f;
      --btn: #2a2a2a; --btn-hover: #363636;
    }
  }
  :root[data-theme="dark"] {
    --bg: #191919; --fg: #e9e9e7; --muted: #7f7f7f; --track: #2f2f2f;
    --btn: #2a2a2a; --btn-hover: #363636;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 12px;
    user-select: none;
  }
  .timer { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .ring { position: relative; width: min(180px, 60vh, 80vw); aspect-ratio: 1; cursor: pointer; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 8; }
  .track { stroke: var(--track); }
  .progress { stroke: var(--accent); stroke-linecap: round; transition: stroke 0.2s; }
  .done .progress { stroke: var(--done); }
  .time {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .digits { font-size: clamp(28px, 11vmin, 48px); font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .label { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .done .digits { color: var(--done); animation: pulse 1s ease-in-out 3; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  .controls { display: flex; gap: 8px; }
  button {
    font: inherit; font-size: 14px; color: var(--fg);
    background: var(--btn); border: 0; border-radius: 6px;
    padding: 6px 14px; cursor: pointer; min-width: 76px;
  }
  button:hover { background: var(--btn-hover); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.08); background: var(--accent); }
</style>
</head>
<body>
<div class="timer" id="timer">
  <div class="ring" id="ring" title="Click or press Space to start/pause">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle class="track" cx="50" cy="50" r="44"></circle>
      <circle class="progress" id="progress" cx="50" cy="50" r="44"></circle>
    </svg>
    <div class="time">
      <div class="digits" id="digits" role="timer" aria-live="off">1:00</div>
      <div class="label" id="label">ready</div>
    </div>
  </div>
  <div class="controls">
    <button class="primary" id="toggle">Start</button>
    <button id="reset">Reset</button>
  </div>
</div>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const theme = params.get("theme");
  if (theme === "dark" || theme === "light") document.documentElement.dataset.theme = theme;
  const TOTAL = Math.max(1, parseInt(params.get("seconds"), 10) || 60) * 1000;
  const SOUND = params.get("sound") !== "off";

  const $ = (id) => document.getElementById(id);
  const timerEl = $("timer"), digits = $("digits"), label = $("label");
  const progress = $("progress"), toggleBtn = $("toggle"), resetBtn = $("reset"), ring = $("ring");

  const C = 2 * Math.PI * 44;
  progress.style.strokeDasharray = C;

  let remaining = TOTAL;   // ms left when paused
  let endAt = null;        // timestamp when running
  let raf = null;
  let doneTimer = null;   // backup so it finishes even when the tab is hidden

  const fmt = (ms) => {
    const s = Math.ceil(ms / 1000);
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  };

  function render(ms) {
    digits.textContent = fmt(ms);
    progress.style.strokeDashoffset = C * (1 - ms / TOTAL);
  }

  function chime() {
    if (!SOUND) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.25, 0.5].forEach((t, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sine";
        o.frequency.value = i === 2 ? 1046.5 : 880;
        g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.35);
        o.connect(g).connect(ctx.destination);
        o.start(ctx.currentTime + t);
        o.stop(ctx.currentTime + t + 0.4);
      });
      setTimeout(() => ctx.close(), 1200);
    } catch (e) {}
  }

  function tick() {
    const ms = Math.max(0, endAt - performance.now());
    render(ms);
    if (ms <= 0) return finish();
    raf = requestAnimationFrame(tick);
  }

  function start() {
    if (remaining <= 0) reset();
    endAt = performance.now() + remaining;
    timerEl.classList.remove("done");
    toggleBtn.textContent = "Pause";
    label.textContent = "running";
    raf = requestAnimationFrame(tick);
    doneTimer = setTimeout(finish, remaining);
  }

  function pause() {
    cancelAnimationFrame(raf); clearTimeout(doneTimer);
    remaining = Math.max(0, endAt - performance.now());
    endAt = null;
    toggleBtn.textContent = "Resume";
    label.textContent = "paused";
  }

  function finish() {
    if (timerEl.classList.contains("done")) return;
    cancelAnimationFrame(raf); clearTimeout(doneTimer);
    remaining = 0; endAt = null;
    render(0);
    timerEl.classList.add("done");
    toggleBtn.textContent = "Restart";
    label.textContent = "time's up";
    chime();
  }

  function reset() {
    cancelAnimationFrame(raf); clearTimeout(doneTimer);
    remaining = TOTAL; endAt = null;
    timerEl.classList.remove("done");
    toggleBtn.textContent = "Start";
    label.textContent = "ready";
    render(TOTAL);
  }

  const toggle = () => (endAt ? pause() : start());
  toggleBtn.addEventListener("click", toggle);
  ring.addEventListener("click", toggle);
  resetBtn.addEventListener("click", reset);
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space") { e.preventDefault(); toggle(); }
    else if (e.key === "r" || e.key === "R") reset();
  });

  reset();
})();
</script>
</body>
</html>
